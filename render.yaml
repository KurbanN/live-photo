# Опционально: Render.com → Web Service для API (не для статики).
# После создания сервиса укажите URL в GitHub variable VITE_API_BASE_URL.
services:
  - type: web
    name: live-photo-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_PUBLIC_URL
        value: https://kurbann.github.io/live-photo
      - key: ALLOWED_ORIGINS
        value: https://kurbann.github.io,https://kurbann.github.io/live-photo
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: wedding-photos
